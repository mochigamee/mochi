<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi's Candy Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#1a0033;font-family:'Segoe UI',sans-serif;}

#layout{display:flex;height:100vh;width:100%;}
#game-pane{flex:1 1 0;min-width:0;overflow:hidden;}
#game-frame{width:100%;height:100%;border:none;display:block;}

#divider{width:5px;flex-shrink:0;cursor:col-resize;background:rgba(255,77,157,.2);display:flex;align-items:center;justify-content:center;transition:background .15s;}
#divider:hover,#divider.drag{background:rgba(255,77,157,.5);}
#divider::after{content:'⋮';color:rgba(255,77,157,.4);font-size:1rem;pointer-events:none;}

#video-pane{width:340px;flex-shrink:0;display:flex;flex-direction:column;background:#0a0018;border-left:2px solid rgba(255,77,157,.2);}
#video-pane.hidden{width:0;border:none;overflow:hidden;}

#vp-head{height:42px;flex-shrink:0;background:linear-gradient(90deg,#1a0033,#2d0a5e);border-bottom:1px solid rgba(255,77,157,.2);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;}
#vp-title{font-family:'Fredoka One',cursive;font-size:.85rem;color:#ff9de2;white-space:nowrap;}
#vc-status{display:flex;align-items:center;gap:6px;font-size:.68rem;color:rgba(255,200,255,.6);min-width:0;flex:1;justify-content:flex-end;}
#vc-status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#vc-dot{width:8px;height:8px;border-radius:50%;background:#666;flex-shrink:0;}
#vc-dot.connecting{background:#ffb300;animation:blink 1s infinite;}
#vc-dot.live{background:#43d17a;}
@keyframes blink{50%{opacity:.3;}}
#vp-hide{font-size:.7rem;padding:3px 9px;border-radius:10px;border:none;background:rgba(255,77,157,.2);color:#ff9de2;cursor:pointer;flex-shrink:0;}

#vc-stage{flex:1;position:relative;background:#060014;overflow:hidden;min-height:0;}
#vc-remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#060014;}
#vc-local{position:absolute;right:10px;bottom:10px;width:34%;max-width:130px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid rgba(255,77,157,.6);background:#1a0033;transform:scaleX(-1);display:none;box-shadow:0 4px 14px rgba(0,0,0,.5);}
#vc-local.cam-off{opacity:.25;}
.vc-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:linear-gradient(160deg,#0d0020,#1a0033);}
.vc-overlay .ico{font-size:2.8rem;}
.vc-overlay h3{font-family:'Fredoka One',cursive;color:#ff9de2;font-size:1.1rem;}
.vc-overlay p{font-size:.76rem;color:rgba(255,200,255,.55);line-height:1.6;max-width:250px;}
#vc-wait{background:transparent;pointer-events:none;display:none;}
#vc-wait .ico{font-size:2rem;}
#vc-wait p{background:rgba(10,0,24,.6);padding:6px 12px;border-radius:12px;}
#vc-join{font-family:'Fredoka One',cursive;padding:10px 26px;border-radius:20px;border:none;background:linear-gradient(135deg,#ff4d9d,#c2185b);color:#fff;cursor:pointer;font-size:.95rem;}
#vc-join:hover{opacity:.85;}

#vc-bar{height:52px;flex-shrink:0;display:none;align-items:center;justify-content:center;gap:10px;background:#12002a;border-top:1px solid rgba(255,77,157,.2);}
#vc-bar button{height:34px;min-width:40px;padding:0 12px;border-radius:17px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1rem;cursor:pointer;}
#vc-bar button:hover{background:rgba(255,255,255,.2);}
#vc-bar button.off{background:#c62828;}
#vc-bar button.txt{font-size:.72rem;}
#vc-bar #vc-end{background:#c62828;font-size:.72rem;}

@media (max-width:768px),(pointer:coarse){
  #layout{flex-direction:column;}
  #video-pane{width:100%!important;height:220px;border-left:none;border-top:2px solid rgba(255,77,157,.2);}
  #video-pane.hidden{height:0;width:100%!important;}
  #divider{width:100%;height:5px;cursor:row-resize;}
  #divider::after{transform:rotate(90deg);}
  #game-pane{flex:1;min-height:0;}
}
</style>
</head>
<body>
<div id="layout">
  <div id="game-pane">
    <iframe id="game-frame" src="candyland_powerups.html?v=37"
      allow="autoplay; fullscreen; accelerometer; gyroscope"
      allowfullscreen></iframe>
  </div>
  <div id="divider"></div>
  <div id="video-pane">
    <div id="vp-head">
      <span id="vp-title">📹 Video Chat</span>
      <div id="vc-status"><i id="vc-dot"></i><span id="vc-status-text">Not in call</span></div>
      <button id="vp-hide" onclick="toggleVP()">Hide ◀</button>
    </div>
    <div id="vc-stage">
      <video id="vc-remote" autoplay playsinline></video>
      <video id="vc-local" autoplay playsinline muted></video>
      <div id="vc-wait" class="vc-overlay"><div class="ico">⏳</div><p id="vc-wait-text">Waiting for your friend to join video…</p></div>
      <div id="vc-setup" class="vc-overlay">
        <div class="ico">📹</div>
        <h3>Video Chat</h3>
        <p id="vc-setup-text">Start or join a 2-player room in the game, then both of you click Join video. No account or link needed.</p>
        <button id="vc-join" onclick="vcJoin()">Join video ▶</button>
      </div>
    </div>
    <div id="vc-bar">
      <button id="vc-mic" onclick="vcToggleMic()" title="Mute / unmute microphone">🎤</button>
      <button id="vc-cam" onclick="vcToggleCam()" title="Camera on / off">📷</button>
      <button id="vc-redo" class="txt" onclick="vcReconnect()" title="Reconnect video if it freezes or drops">↻ Reconnect</button>
      <button id="vc-end" onclick="vcLeave()">Leave</button>
    </div>
  </div>
</div>

<script src="peerjs.min.js"></script>
<script>
const frame=document.getElementById('game-frame');
const $=id=>document.getElementById(id);

// ───────── layout: resize / hide the video pane ─────────
const divEl=$('divider'), vpEl=$('video-pane');
let drag=false,sx=0,sw=0,vpOn=true;
function focusGame(){ try{ frame.focus(); frame.contentWindow.focus(); }catch(e){} }

// Mobile: hide video pane by default
if(window.innerWidth<=768||window.matchMedia('(pointer:coarse)').matches){ setTimeout(toggleVP,100); }

divEl.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sw=vpEl.offsetWidth;divEl.classList.add('drag');document.body.style.cssText='cursor:col-resize;user-select:none;';frame.style.pointerEvents='none';});
document.addEventListener('mousemove',e=>{if(!drag)return;vpEl.style.width=Math.max(200,Math.min(900,sw+(sx-e.clientX)))+'px';});
document.addEventListener('mouseup',()=>{if(!drag)return;drag=false;divEl.classList.remove('drag');document.body.style.cssText='';frame.style.pointerEvents='';});
function toggleVP(){vpOn=!vpOn;vpEl.classList.toggle('hidden',!vpOn);divEl.style.display=vpOn?'flex':'none';$('vp-hide').textContent=vpOn?'Hide ◀':'Show ▶';focusGame();}

// ───────── video chat (peer-to-peer, no third-party room) ─────────
// The game tells us its room code and whether we are host or guest. Each player
// opens a PeerJS peer named after the room + role. The guest calls the host;
// the host answers. Nothing is stored anywhere and there is no time limit.
const VC={room:null,role:null,joined:false,stream:null,peer:null,call:null,timer:null,idTries:0,micOn:true,camOn:true};
const ICE=[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'},
  {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}
];
const peerOpts=()=>Object.assign({host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0,config:{iceServers:ICE}},window.VC_PEER_OPTS||{});
const myId=()=>`mochi-vc-${VC.room}-${VC.role}`;
const otherId=()=>`mochi-vc-${VC.room}-${VC.role==='host'?'guest':'host'}`;
const canVideo=()=>!!VC.room&&(VC.role==='host'||VC.role==='guest');

function setStatus(kind,text){ $('vc-dot').className=kind||''; $('vc-status-text').textContent=text; }
function showWait(on,text){ $('vc-wait').style.display=on?'flex':'none'; if(text) $('vc-wait-text').textContent=text; }
function refreshSetupText(){
  $('vc-setup-text').textContent=canVideo()
    ? 'Your room is ready. Click Join video, and ask your friend to do the same.'
    : 'Start or join a 2-player room in the game, then both of you click Join video. No account or link needed.';
}

window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow) return;
  const d=e.data;
  if(!d||d.type!=='mpRoom') return;
  const role=(d.role==='host'||d.role==='guest')?d.role:null;
  const room=role&&d.room?String(d.room):null;
  const changed=room!==VC.room||role!==VC.role;
  VC.room=room; VC.role=role;
  refreshSetupText();
  if(changed&&VC.joined){
    if(canVideo()){ showWait(true,'Waiting for your friend to join video…'); startPeer(); }
    else { dropCall(); destroyPeer(); setStatus('connecting','Waiting for a 2-player room'); showWait(true,'Host or join a 2-player game and video will connect automatically.'); }
  }
});

async function vcJoin(){
  if(typeof Peer==='undefined'){ $('vc-setup-text').textContent='Video library did not load. Make sure peerjs.min.js is uploaded next to index.html, then refresh.'; setStatus('','Video library missing'); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $('vc-setup-text').textContent='This page needs HTTPS (or localhost) to use the camera.'; setStatus('','Camera unavailable'); return; }
  setStatus('connecting','Allow camera & mic…');
  const vid={width:{ideal:640},height:{ideal:480},frameRate:{ideal:24}};
  const aud={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
  try{ VC.stream=await navigator.mediaDevices.getUserMedia({video:vid,audio:aud}); VC.camOn=true; }
  catch(e){
    try{ VC.stream=await navigator.mediaDevices.getUserMedia({video:false,audio:aud}); VC.camOn=false; }
    catch(e2){ setStatus('','Camera/mic blocked — allow access in your browser'); return; }
  }
  VC.joined=true; VC.micOn=true;
  const lv=$('vc-local'); lv.srcObject=VC.stream; lv.style.display=VC.camOn?'block':'none';
  $('vc-setup').style.display='none'; $('vc-bar').style.display='flex';
  $('vc-mic').textContent='🎤'; $('vc-mic').classList.remove('off');
  $('vc-cam').textContent=VC.camOn?'📷':'🚫'; $('vc-cam').classList.toggle('off',!VC.camOn); $('vc-cam').disabled=!VC.camOn&&!VC.stream.getVideoTracks().length;
  if(canVideo()) showWait(true,'Waiting for your friend to join video…');
  else { setStatus('connecting','Waiting for a 2-player room'); showWait(true,'Camera is on. Now host or join a 2-player game and video will connect automatically.'); }
  startPeer();
  focusGame();
}

function destroyPeer(){ if(VC.timer){clearInterval(VC.timer);VC.timer=null;} if(VC.peer){ const p=VC.peer; VC.peer=null; try{p.destroy();}catch(e){} } }   // clear first: destroy() fires 'disconnected' before it marks itself destroyed
function dropCall(){ if(VC.call){ const c=VC.call; VC.call=null; try{c.close();}catch(e){} } clearRemote(); }
function clearRemote(){ const r=$('vc-remote'); r.srcObject=null; }

function startPeer(){
  dropCall(); destroyPeer();
  if(!VC.joined||!canVideo()) return;
  setStatus('connecting','Connecting…');
  const p=new Peer(myId(),peerOpts());
  VC.peer=p;
  p.on('open',()=>{
    if(VC.peer!==p) return;
    VC.idTries=0;
    setStatus('connecting','Waiting for friend…');
    if(VC.role==='guest'){ dial(); VC.timer=setInterval(()=>{ if(!VC.call||!VC.call.open) dial(); },4000); }
  });
  p.on('call',c=>{
    if(VC.peer!==p||!VC.stream){ try{c.close();}catch(e){} return; }
    if(VC.call&&VC.call!==c){ const old=VC.call; VC.call=null; try{old.close();}catch(e){} }
    c.answer(VC.stream); attach(c);
  });
  p.on('disconnected',()=>{ if(VC.peer===p&&!p.destroyed){ try{p.reconnect();}catch(e){} } });
  p.on('error',err=>{
    if(VC.peer!==p) return;
    const t=err&&err.type;
    if(t==='peer-unavailable') return;                       // friend isn't in video yet — the retry timer handles it
    if(t==='unavailable-id'){                                // our previous session is still registered; try again shortly
      if(++VC.idTries>8){ setStatus('','Video busy — click Reconnect'); return; }
      setTimeout(()=>{ if(VC.peer===p) startPeer(); },3000); return;
    }
    if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){
      setStatus('connecting','Video server unreachable — retrying…');
      setTimeout(()=>{ if(VC.peer===p) startPeer(); },5000); return;
    }
    console.warn('video error',err);
  });
}
function dial(){
  const p=VC.peer; if(!p||p.destroyed||!p.open||!VC.stream) return;
  if(VC.call){ try{VC.call.close();}catch(e){} VC.call=null; }
  attach(p.call(otherId(),VC.stream));
}
function attach(c){
  if(!c) return;
  VC.call=c;
  c.on('stream',st=>{
    if(VC.call!==c) return;
    const r=$('vc-remote'); r.srcObject=st; r.play().catch(()=>{});
    showWait(false); setStatus('live','In call with friend');
  });
  c.on('close',()=>{
    if(VC.call!==c) return;
    VC.call=null; clearRemote();
    if(VC.joined){ showWait(true,'Friend left video — waiting…'); setStatus('connecting','Waiting for friend…'); }
  });
  c.on('error',()=>{});
}

function vcToggleMic(){
  if(!VC.stream) return;
  VC.micOn=!VC.micOn;
  VC.stream.getAudioTracks().forEach(t=>t.enabled=VC.micOn);
  $('vc-mic').textContent=VC.micOn?'🎤':'🔇'; $('vc-mic').classList.toggle('off',!VC.micOn);
  focusGame();
}
function vcToggleCam(){
  if(!VC.stream||!VC.stream.getVideoTracks().length) return;
  VC.camOn=!VC.camOn;
  VC.stream.getVideoTracks().forEach(t=>t.enabled=VC.camOn);
  $('vc-cam').textContent=VC.camOn?'📷':'🚫'; $('vc-cam').classList.toggle('off',!VC.camOn);
  $('vc-local').classList.toggle('cam-off',!VC.camOn);
  focusGame();
}
function vcReconnect(){ if(VC.joined){ VC.idTries=0; showWait(true,'Reconnecting…'); startPeer(); } focusGame(); }
function vcLeave(){
  dropCall(); destroyPeer();
  if(VC.stream){ VC.stream.getTracks().forEach(t=>t.stop()); VC.stream=null; }
  VC.joined=false;
  $('vc-local').srcObject=null; $('vc-local').style.display='none'; $('vc-local').classList.remove('cam-off');
  $('vc-bar').style.display='none'; showWait(false); $('vc-setup').style.display='flex';
  refreshSetupText(); setStatus('','Not in call');
  focusGame();
}
window.addEventListener('beforeunload',()=>{ try{ if(VC.peer) VC.peer.destroy(); }catch(e){} });
</script>
</body>
</html>
